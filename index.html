<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Valentine ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section -->
  <div class="hero">
    <h1>Happy Valentine’s Day 💖</h1>
    <p>To My Love, You Mean Everything to Me</p>
    <button onclick="openHeart()">Open My Heart 💌</button>
  </div>

  <!-- Love Message -->
  <div class="message" id="loveMessage">
    <h2>My Love Letter 💕</h2>
    <p>
      Every day with you is special.
      I’m so lucky to have you.
      I love you forever ❤️
    </p>
  </div>

  <!-- Countdown -->
  <div class="countdown">
    <h2>Countdown to Valentine’s Day 💘</h2>
    <p id="timer"></p>
  </div>

  <!-- Floating Hearts -->
  <div class="hearts"></div>

  <script src="script.js"></script>
</body>
</html>
